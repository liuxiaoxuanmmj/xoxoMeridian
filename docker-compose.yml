services:
  postgres:
    image: postgres:16-alpine
    container_name: xoxo-meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xoxo
      POSTGRES_PASSWORD: xoxo_password
      POSTGRES_DB: xoxo_meridian
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xoxo -d xoxo_meridian"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
    container_name: xoxo-meridian-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xoxo:xoxo_password@postgres:5432/xoxo_meridian?schema=public
      DIRECT_URL: postgresql://xoxo:xoxo_password@postgres:5432/xoxo_meridian?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      DEMO_ROOM_SLUG: our-room
      LLM_PROVIDER: openai-compatible
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      WEATHER_PROVIDER: mock
      AGENT_TASK_INLINE_RUN: "false"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent-worker:
    build:
      context: .
    container_name: xoxo-meridian-agent-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xoxo:xoxo_password@postgres:5432/xoxo_meridian?schema=public
      DIRECT_URL: postgresql://xoxo:xoxo_password@postgres:5432/xoxo_meridian?schema=public
      LLM_PROVIDER: openai-compatible
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      WEATHER_PROVIDER: mock
      AGENT_WORKER_POLL_MS: 3000
    command: npm run agent:worker

volumes:
  postgres-data:
